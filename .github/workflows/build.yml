name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image ships the Android SDK (ANDROID_HOME) with accepted licenses;
      # AGP downloads any missing platform/build-tools by itself.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      # Logs are not always downloadable, so failures are surfaced as one annotation (readable via the API).
      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(grep -E -A3 "^e: |What went wrong|FAILED|AssertionError|Exception" build.log | head -120 \
              | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
          else
            echo "::error title=Gradle build failed::no build.log (failed before Gradle ran)"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SignalLogger-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SignalLogger-debug
          path: SignalLogger-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" SignalLogger-debug.apk \
            --title "SignalLogger build ${{ github.run_number }}" \
            --notes "Debug APK z commita ${{ github.sha }}"
